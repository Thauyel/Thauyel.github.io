<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Residence · Permit tracker</title>
<style>
  :root { --base:#101010; --panel:#171717; --surface:#303030; --text:#f1f1f1; --muted:#ababab; --green:#a6e3a1; --blue:#89b4fa; --yellow:#f9e2af; --red:#f38ba8; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--base); color:var(--text); font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  button,a,summary { -webkit-tap-highlight-color:transparent; }
  :focus-visible { outline:2px solid var(--text); outline-offset:5px; }
  .shell { max-width:1200px; margin:auto; padding:30px 40px 32px; }
  .profiles { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; }
  .card { min-width:0; background:var(--panel); border:1px solid var(--surface); border-radius:14px; padding:26px 28px 16px; }
  .card-main { display:grid; gap:24px; }
  .identity { display:flex; align-items:center; gap:14px; min-width:0; }
  .avatar { flex:none; width:44px; height:44px; display:grid; place-items:center; border:1px solid #494949; border-radius:50%; color:var(--text); font:500 .75rem/1 ui-monospace,Consolas,monospace; }
  h2 { margin:0 0 3px; font-size:1.65rem; line-height:1.15; letter-spacing:-.04em; font-weight:550; }
  .code { color:var(--muted); font: .72rem/1.6 ui-monospace,Consolas,monospace; overflow-wrap:anywhere; }
  .record-number { align-self:start; margin-left:auto; color:var(--muted); font: .65rem/1.5 ui-monospace,Consolas,monospace; }
  .status { --result:var(--muted); min-width:0; min-height:100px; border-top:1px solid var(--surface); padding-top:20px; }
  .status-title { display:flex; align-items:center; gap:9px; margin:0 0 8px; font-size:1rem; font-weight:600; letter-spacing:-.015em; color:var(--result); }
  .status-title::before { content:""; width:7px; height:7px; border-radius:50%; background:currentColor; flex:none; }
  .detail { color:var(--muted); font-size:.78rem; line-height:1.6; margin:0; max-width:390px; }
  [data-state="READY"] .status { --result:var(--green); }
  [data-state="DELIVERED"] .status { --result:var(--blue); }
  [data-state="PROCESSING"] .status,[data-state="UNKNOWN"] .status { --result:var(--yellow); }
  [data-state="NOT FOUND"] .status,[data-state="CONNECTION FAILED"] .status { --result:var(--red); }
  .actions { display:flex; gap:10px; }
  .button { min-height:44px; padding:11px 18px; border:1px solid #494949; border-radius:7px; background:transparent; color:var(--text); font:600 .75rem/1.4 system-ui,sans-serif; text-decoration:none; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; transition:background .15s,border-color .15s; }
  .primary { flex:1; background:var(--text); color:var(--base); border-color:var(--text); }
  .button:hover:not(:disabled) { background:var(--surface); border-color:var(--muted); }
  .primary:hover:not(:disabled) { background:#d4d4d4; color:var(--base); border-color:#d4d4d4; }
  .button:disabled { cursor:not-allowed; background:#242424; color:var(--muted); border-color:var(--surface); }
  .spinner { display:none; width:13px; height:13px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; animation:spin .8s linear infinite; }
  [data-state="CHECKING"] .spinner { display:inline-block; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .card-footer { display:flex; flex-direction:column; margin-top:18px; border-top:1px solid var(--surface); padding-top:12px; gap:5px; color:var(--muted); font: .65rem/1.7 ui-monospace,Consolas,monospace; }
  details { min-width:0; }
  summary { cursor:pointer; width:fit-content; min-height:28px; padding:5px 0; }
  summary:hover { color:var(--text); }
  .logs { margin:0; padding:8px 0 12px 18px; max-height:180px; overflow:auto; overflow-wrap:anywhere; font-size:.68rem; }
  .card-footer time { order:-1; }
  @media(min-width:900px) { .card-footer { position:relative; } .card-footer time { position:absolute; right:0; top:17px; pointer-events:none; } summary { max-width:110px; } }
  @media(max-width:640px) { .shell { padding:20px 18px 26px; } .profiles { grid-template-columns:1fr; gap:14px; } .card { padding:22px 20px 14px; } .status { min-height:92px; } }
  @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<main class="shell">
  <section class="profiles" id="profiles" aria-label="Permit applications"></section>
  <noscript><p>Enable JavaScript to use this tracker. No checks run automatically.</p></noscript>
</main>
<script>
"use strict";
// ==================== CONFIGURATION ====================
const PROFILES = [
  { name: "Thau", id: "059566621824", initials: "TH" },
  { name: "Cungo", id: "059566621801", initials: "CU" },
  { name: "EJR", id: "059566621812", initials: "EJ" },
  { name: "Fati", id: "059566415561", initials: "FA" }
];
const TARGET_BASE = "https://questure.poliziadistato.it/stranieri/?mime=1&lang=english&pratica=";
const CUSTOM_WORKER_URL = "https://cors-proxy.atacan-k03.workers.dev";
const PROXY_CONFIGS = [
  { name:"custom-worker", build:url => `${CUSTOM_WORKER_URL}?url=${encodeURIComponent(url)}`, timeout:10000 },
  { name:"corsproxy.io", build:url => `https://corsproxy.io/?${encodeURIComponent(url)}`, timeout:15000 },
  { name:"allorigins-raw", build:url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}&t=${Date.now()}`, timeout:15000 },
  { name:"allorigins-get", build:url => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}&t=${Date.now()}`, timeout:15000, parseJSON:true },
  { name:"thingproxy", build:url => `https://thingproxy.freeboard.io/fetch/${url}`, timeout:12000 },
  { name:"codetabs", build:url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`, timeout:12000 }
];
const MESSAGES = {
  READY:"The document is ready for collection. Confirm collection details on the official site.",
  DELIVERED:"The document has already been delivered or collected.",
  PROCESSING:"The application is still in progress or the document is not yet ready.",
  "NOT FOUND":"The application was not found. Check the code on the official site.",
  UNKNOWN:"The response could not be interpreted reliably. Please check the official site.",
  "CONNECTION FAILED":"All connection routes failed. Try again or open the official site."
};

// ==================== PARSING ====================
// Conservative, complete assertions only. Navigation, instructions and isolated
// words (including "ready" and "collect") are never evidence of a status.
function parseResponse(html) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  doc.querySelectorAll("script,style,noscript,nav,header,footer,form,select,template,[hidden],[aria-hidden='true']").forEach(node => node.remove());
  doc.querySelectorAll("br,p,div,li,td,h1,h2,h3,section,article").forEach(node => { node.append(doc.createTextNode("\n")); });
  const text = (doc.body.textContent || "").toLowerCase().replace(/[’‘]/g,"'");
  if (/bad gateway|proxy error|fetch error|access denied|captcha|service unavailable|cloudflare ray|too many requests/.test(text)) return "UNKNOWN";
  const lines = text.split(/[\n.!?;]+/).map(line => line.replace(/\s+/g," ").trim()).filter(Boolean);
  const results = new Set();
  for (const line of lines) {
    if (/\b(if|when|once|until|may|might|could|will|should|how to|example)\b/.test(line)) continue;
    const subject = "(?:(?:your|the|this) )?(?:residence permit|permit|document|application|practice|application code)";
    const italian = "(?:(?:il|la|suo|sua|il suo|la sua) )?(?:permesso(?: di soggiorno)?|documento|pratica)";
    const assertion = line.replace(/^(?:status|application status|stato(?: della pratica)?)\s*:\s*/, "");
    const matches = tail => new RegExp(`^(?:${subject}) (?:${tail})$`).test(assertion);
    const matchesIT = tail => new RegExp(`^(?:${italian}) (?:${tail})$`).test(assertion);
    if (matches("(?:is |was )?(?:not found|not present(?: in (?:the )?(?:system|archive))?|invalid)|does not exist") ||
        matchesIT("(?:è |e' |risulta )?(?:non presente(?: in archivio)?|non trovat[oa]|inesistente)|non esiste")) results.add("NOT FOUND");
    else if (matches("(?:is not|isn't|is not yet|isn't yet) ready(?: for (?:collection|pickup|pick-up))?(?: yet)?") ||
             matchesIT("(?:non è|non e'|non è ancora|non e' ancora) pront[oa](?: per il ritiro)?")) results.add("PROCESSING");
    else if (matches("(?:has (?:already )?been|was|is) (?:delivered|collected)(?: already)?") ||
             matchesIT("(?:è stato |è |e' |risulta )(?:già )?(?:consegnato|ritirato)")) results.add("DELIVERED");
    else if (matches("(?:is |is currently )?(?:being processed|under discussion|under review|in progress|in process|processing)") ||
             matchesIT("(?:è |e' |risulta )?(?:in trattazione|in lavorazione|in esame)")) results.add("PROCESSING");
    else if (matches("(?:is |is now )ready(?: for (?:collection|pickup|pick-up))?|can be collected") ||
             matchesIT("(?:è |e' |risulta )pronto(?: per il ritiro)?")) results.add("READY");
  }
  // Conflicting assertions can be a help page or a changed upstream layout.
  return results.size === 1 ? [...results][0] : "UNKNOWN";
}

// ==================== NETWORKING ====================
async function fetchWithProxy(proxy, target) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), proxy.timeout);
  try {
    const response = await fetch(proxy.build(target), { signal:controller.signal, cache:"no-store", headers:{Accept:"text/html,application/json"} });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    // The timeout remains active through body consumption, including JSON wrappers.
    let body = await response.text();
    if (proxy.parseJSON) {
      const wrapper = JSON.parse(body);
      if (wrapper.status?.http_code && Number(wrapper.status.http_code) >= 400) throw new Error(`Upstream HTTP ${wrapper.status.http_code}`);
      if (typeof wrapper.contents !== "string") throw new Error("Missing response content");
      body = wrapper.contents;
    }
    return body;
  } finally { clearTimeout(timer); }
}
async function checkStatus(code, log) {
  if (!code.trim()) throw new Error("Application code needed");
  let receivedResponse = false;
  for (let i = 0; i < PROXY_CONFIGS.length; i++) {
    const proxy = PROXY_CONFIGS[i];
    log(`${i + 1}/${PROXY_CONFIGS.length} · Connecting via ${proxy.name}…`);
    try {
      const body = await fetchWithProxy(proxy, TARGET_BASE + encodeURIComponent(code));
      receivedResponse = true;
      const status = parseResponse(body);
      if (status !== "UNKNOWN") { log(`Response interpreted: ${status}.`); return status; }
      log("Response not conclusive. Trying the next route.");
    } catch (error) {
      log(error.name === "AbortError" ? "Request timed out." : `Route failed: ${error.message}`);
    }
    if (i < PROXY_CONFIGS.length - 1) await new Promise(resolve => setTimeout(resolve, 300));
  }
  return receivedResponse ? "UNKNOWN" : "CONNECTION FAILED";
}

// ==================== UI ====================
const views = [];
const runs = PROFILES.map(() => ({ busy:false, generation:0 }));

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}
function setStatus(index, status, detail) {
  const view = views[index];
  view.card.dataset.state = status;
  view.title.textContent = status;
  view.detail.textContent = detail;
}
function createCard(profile, index) {
  const configured = Boolean(profile.id.trim());
  const card = element("article", "card");
  card.setAttribute("aria-labelledby", `name-${index}`);
  const main = element("div", "card-main");
  const identity = element("div", "identity");
  const avatar = element("span", "avatar", profile.initials);
  avatar.setAttribute("aria-hidden", "true");
  const person = element("div");
  const name = element("h2", "", profile.name); name.id = `name-${index}`;
  person.append(name, element("div", "code", configured ? profile.id : "Code not configured"));
  const number = element("span", "record-number", String(index + 1).padStart(2, "0"));
  number.setAttribute("aria-hidden", "true");
  identity.append(avatar, person, number);
  const status = element("div", "status");
  status.setAttribute("role", "status"); status.setAttribute("aria-atomic", "true");
  status.setAttribute("aria-label", `${profile.name} application status`);
  const title = element("p", "status-title", configured ? "Not checked yet" : "Application code needed");
  const detail = element("p", "detail", configured ? "No status requested this session." : `Add ${profile.name}’s code in the page configuration to enable checks.`);
  status.append(title, detail);
  const actions = element("div", "actions");
  const button = element("button", "button primary"); button.type = "button"; button.disabled = !configured;
  button.setAttribute("aria-label", `Check ${profile.name} permit status`);
  const spinner = element("span", "spinner"); spinner.setAttribute("aria-hidden", "true");
  const label = element("span", "", "Check"); button.append(spinner, label);
  button.addEventListener("click", () => handleCheck(index));
  const open = element(configured ? "a" : "button", "button", "Open Site ↗");
  open.setAttribute("aria-label", `Open official status page for ${profile.name} (new tab)`);
  if (configured) { open.href = TARGET_BASE + encodeURIComponent(profile.id); open.target = "_blank"; open.rel = "noopener noreferrer"; }
  else { open.type = "button"; open.disabled = true; }
  actions.append(button, open); main.append(identity, status, actions);
  const bottom = element("div", "card-footer");
  const disclosure = element("details");
  const summary = element("summary", "", "Check activity"); summary.setAttribute("aria-label", `Check activity for ${profile.name}`);
  const logs = element("ol", "logs"); logs.append(element("li", "", "No checks yet."));
  disclosure.append(summary, logs);
  const time = element("time", "", "Last checked: never");
  bottom.append(disclosure, time); card.append(main, bottom);
  views.push({card, title, detail, button, label, logs, time});
  return card;
}
async function handleCheck(index) {
  const profile = PROFILES[index], run = runs[index], view = views[index];
  if (!profile || !profile.id.trim() || run.busy) return;
  run.busy = true;
  const generation = ++run.generation;
  const code = profile.id;
  const current = () => run.generation === generation && profile.id === code;
  view.button.disabled = true; view.label.textContent = "Checking…";
  view.button.setAttribute("aria-busy", "true");
  view.logs.replaceChildren();
  setStatus(index, "CHECKING", "Contacting the status service. This can take a minute.");
  const log = message => { if (current()) view.logs.append(element("li", "", `${new Date().toLocaleTimeString()} · ${message}`)); };
  try {
    const result = await checkStatus(code, log);
    if (current()) { setStatus(index, result, MESSAGES[result]); log("Check complete."); }
  } catch (error) {
    if (current()) { setStatus(index, "CONNECTION FAILED", MESSAGES["CONNECTION FAILED"]); log(`Check failed: ${error.message}`); }
  } finally {
    if (run.generation === generation) {
      run.busy = false;
      view.button.disabled = !profile.id.trim(); view.label.textContent = "Check";
      view.button.removeAttribute("aria-busy");
      if (current()) {
        const now = new Date(); view.time.dateTime = now.toISOString();
        view.time.textContent = `Last checked: ${now.toLocaleString()}`;
      }
    }
  }
}
// Rendering only: no network activity until an individual Check is selected.
PROFILES.forEach((profile, index) => document.getElementById("profiles").append(createCard(profile, index)));
</script>
</body>
</html>
